# gnss-pos-ladder / RTKLIB 2.4.2 — Stage C PPP-static (GPS+BDS, precise)
pos1-posmode       =ppp-static
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =10
pos1-snrmask       =0
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =dual-freq
pos1-tropopt       =est-ztd
pos1-sateph        =precise
pos1-navsys        =33         # GPS + BDS
out-solformat      =xyz
out-outhead        =on
out-outopt         =on
out-timesys        =gpst
out-timeform       =hms
out-timendec       =3
out-solstatic      =all
